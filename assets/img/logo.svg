<svg xmlns="http://www.w3.org/2000/svg" viewBox="193 530 2613 941" fill="currentColor">
<!--
  Logotype officiel — Philippe Grégoire Yacé.

  Livré en « Logo-Philippe-Gregoire-YACE-5-01.svg », repris ici sans retoucher
  un seul tracé. Trois choses ont changé, toutes hors du dessin :

  1. Le cadre. La livraison était posée dans un viewBox de 3000 x 2000 dont le
     dessin n'occupait que la bande centrale — un tiers de vide en haut et en
     bas, que le CSS aurait fallu compenser à chaque emplacement. Le viewBox
     est recadré sur la boîte réelle du dessin (193 530 2613 941), mesurée au
     navigateur. Rapport : 2,78:1.
  2. La couleur. Le fichier portait fill:#595959 dans un bloc <style> avec une
     classe .cls-1. Deux problèmes : une couleur en dur ne peut pas passer du
     gris de l'en-tête au papier du pied, et une classe générique se
     télescoperait avec l'autre exemplaire de la page. Remplacés par
     fill="currentColor" sur la racine, qui suit la couleur du contexte.
  3. Les identifiants. id="Calque_1" et data-name retirés, pour la même raison :
     le logo apparaît deux fois par page.

  Le gris officiel du fichier livré est #595959. Il n'est employé nulle part
  tel quel : le logo prend l'encre de son contexte, comme le faisait déjà le
  verrou qu'il remplace. Voir README §1.
-->
